<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskFlow</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="auth-container">

        <h1>TaskFlow</h1>

        <section class="auth-card">

            <h2>Вход</h2>

            <form id="loginForm">

                <div class="form-group">
                    <label for="loginUsername">Логин</label>

                    <input type="text" id="loginUsername" placeholder="Введите логин" autocomplete="username" required>
                </div>

                <div class="form-group">
                    <label for="loginPassword">Пароль</label>

                    <input type="password" id="loginPassword" placeholder="Введите пароль" autocomplete="current-password" required>
                </div>

                <button type="submit">
                    Войти
                </button>

                <p id="loginMessage" class="message" role="alert" aria-live="polite"></p>

            </form>


            <hr>


            <h2>Регистрация</h2>

            <form id="registerForm">

                <div class="form-group">
                    <label for="registerUsername">Логин</label>

                    <input type="text" id="registerUsername" placeholder="От 3 до 20 символов" autocomplete="username" required minlength="3" maxlength="21">
                </div>

                <div class="form-group">
                    <label for="registerPassword">Пароль</label>

                    <input type="password" id="registerPassword" placeholder="От 6 до 30 символов" autocomplete="new-password" required minlength="6" maxlength="30">
                </div>

                <button type="submit">
                    Зарегистрироваться
                </button>

                <p id="registerMessage" class="message" role="status" aria-live="polite"></p>

            </form>

        </section>

    </main>

    <script src="js/session.js"></script>
    <script src="js/auth.js"></script>

</body>
</html>
